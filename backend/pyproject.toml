[project]
name = "gold-analysis"
version = "0.1.0"
description = "Gold Analysis System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "influxdb-client>=1.30.0",
    "slowapi>=0.1.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TRY", # tryceratops
    "BLE", # flake8-blind-except
    "ASYNC", # flake8-async
]
ignore = [
    "BLE001",  # Blind except - intentional for middleware/error handling
    "S110",    # Try-except-pass - intentional for optional deps
    "RUF012",  # Mutable class default - handled with ClassVar
    "DTZ005",  # datetime.now() - some cases intentional
    "RUF001",  # Ambiguous-unicode - false positive for Chinese identifiers
    "RUF002",  # Ambiguous-unicode docstring - false positive for Chinese docstrings
    "RUF003",  # Ambiguous-unicode comment - false positive for Chinese comments
    "TRY003",  # raise-vanilla-args - built-in exceptions (ValueError, TypeError) are idiomatic
    "TRY300",  # try-consider-else - style preference, code is correct without refactor
    "TRY400",  # error-instead-of-exception - logging.error is intentional in non-exexcept paths
    "E402",    # module-import-not-at-top - intentional for dotenv/load_dotenv before imports
    "B008",    # function-call-in-default-arg - FastAPI Depends/Query/Path pattern is intentional
    "SIM108",  # if-else-block-instead-of-if-exp - readability preference, not a bug
    "SIM103",  # needless-bool - readability preference
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false
