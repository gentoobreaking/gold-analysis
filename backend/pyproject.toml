[project]
name = "gold-analysis-backend"
version = "0.1.0"
description = "Gold price decision-support / trading backend (FastAPI)."
requires-python = ">=3.11,<3.14"
dependencies = [
    # web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    # data / ml (backend/app imports these)
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # models / config
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # db
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "influxdb-client>=1.40.0",
    "redis>=5.0.0",
    # scheduling (main.py AsyncIOScheduler)
    "apscheduler>=3.10.0",
    # auth / rate-limit (main.py security)
    "passlib>=1.7.4",
    "pyjwt>=2.8.0",
    "slowapi>=0.1.9",
    # http / async
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Legacy root dirs (agents/, backend_mvp/) import openclaw; backend/app does NOT.
# Keep out of the default install so the canonical, tested source stays reproducible.
legacy = ["openclaw>=0.1.0"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    # async in-memory sqlite used by tests/test_db_models.py
    "aiosqlite>=0.19.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
