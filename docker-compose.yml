name: gold-analysis

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI / uvicorn service
  # ─────────────────────────────────────────────────────────────────────────────
  gold-analysis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gold-analysis-backend:latest
    container_name: gold-analysis-backend
    hostname: gold-analysis-backend
    env_file:
      - ./backend/.env
    environment:
      # Override DB URLs for Docker-internal networking
      # Connect to shared tw-quant-db PostgreSQL (twquant_shared)
      DATABASE_URL: >-
        postgresql+asyncpg://twquant:twquant-secret-password@tw-quant-db:5432/twquant_shared
      REDIS_URL: redis://gold-analysis-redis:6379/0
      INFLUXDB_URL: http://gold-analysis-influxdb:8086
    ports:
      - "8000:8000"
    depends_on:
      - gold-analysis-redis
      - gold-analysis-influxdb
    volumes:
      - ./backend/app/migrations:/app/app/migrations
    restart: unless-stopped
    networks:
      - tw-quant-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — React / Vite production server (served by nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  gold-analysis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gold-analysis-frontend:latest
    container_name: gold-analysis-frontend
    hostname: gold-analysis-frontend
    ports:
      - "5173:80"
    depends_on:
      - gold-analysis-backend
    restart: unless-stopped
    networks:
      - tw-quant-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis — rate-limiting, caching, job queue
  # ─────────────────────────────────────────────────────────────────────────────
  gold-analysis-redis:
    image: redis:7-alpine
    container_name: gold-analysis-redis
    hostname: gold-analysis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - tw-quant-network

  # ─────────────────────────────────────────────────────────────────────────────
  # InfluxDB — time-series market data
  # ─────────────────────────────────────────────────────────────────────────────
  gold-analysis-influxdb:
    image: influxdb:2.7-alpine
    container_name: gold-analysis-influxdb
    hostname: gold-analysis-influxdb
    environment:
      INFLUXDB_DB: market-data
      INFLUXDB_ORG: gold-analysis
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - tw-quant-network

volumes:
  redis_data:
  influxdb_data:

networks:
  tw-quant-network:
    name: tw-quant-network
    external: true
